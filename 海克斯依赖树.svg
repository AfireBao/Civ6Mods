<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1680" viewBox="0 0 1800 1680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58606a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #f7f8fa; }
    .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17212b; }
    .subtitle { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5d6875; }
    .panel { fill: #ffffff; stroke: #d7dde5; stroke-width: 1.2; rx: 14; filter: url(#shadow); }
    .panel-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #202a36; }
    .node { stroke-width: 1.4; rx: 8; }
    .root { fill: #eaf5ff; stroke: #3174a8; }
    .mid { fill: #fff5df; stroke: #b87516; }
    .terminal { fill: #eaf8ee; stroke: #3c9150; }
    .special { fill: #f3ebff; stroke: #7b4bb3; }
    .lone { fill: #f5f6f8; stroke: #8a929b; }
    .txt { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17212b; text-anchor: middle; dominant-baseline: middle; }
    .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5563; text-anchor: middle; dominant-baseline: middle; }
    .legend { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5563; }
    .edge { stroke: #58606a; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .edge-soft { stroke: #8a929b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  </style>

